timezone: America/Chicago
owner_email: moses.hoavo@gmail.com

# Co-parent gets each person calendar (separate calendars = distinct colors in her app).
# Google mobile apps paint all events on one shared calendar the same color; event
# colorId alone is not enough for Angela.
shares:
  - email: angelaphuoc@gmail.com
    role: reader # See all event details

# Old calendars — sync migrates managed events onto per-person calendars, then deletes empties.
legacy_combined_calendar_names:
  - Moses, Elliott & Elliana
  - Elliott & Elliana
  - Elliott
  - Elliana
  - Moses

conflict_lookahead_weeks: 8
conflict_scan_owned_calendars: true

retire_title_contains:
  - badminton
  - kumon
  - piano
  - vietnamese

people:
  huy:
    calendar_name: Huy
    color_id: "11" # event Tomato (red)
    calendar_color_id: "3" # calendar list Tomato
    reminder_minutes: 30
  vy:
    calendar_name: Vy
    color_id: "5" # event Banana (yellow)
    calendar_color_id: "12" # calendar list Banana
    reminder_minutes: 30
  hoa:
    calendar_name: Hoa
    color_id: "10" # event Basil (green)
    calendar_color_id: "9" # calendar list Pistachio (brighter green)
    reminder_minutes: 30

series:
  # series ids kept stable so existing managedId events update/migrate
  - id: elliott-badminton-weekday
    person: huy
    summary: Huy Badminton
    days: [TU, WE]
    start: "18:00"
    end: "20:00"

  - id: elliott-badminton-saturday
    person: huy
    summary: Huy Badminton (game time - optional)
    days: [SA]
    start: "13:30"
    end: "15:30"

  - id: huy-badminton-saturday-afternoon
    person: huy
    summary: Huy Badminton
    days: [SA]
    start: "15:30"
    end: "17:30"

  - id: elliott-kumon
    person: huy
    summary: Huy Kumon
    days: [MO, TH]
    start: "16:00"
    end: "16:30"

  # Zoom with teacher in Vietnam: days/times/dates are VIETNAM time (no DST there).
  # Chicago time moves 1h with US DST: CDT = VN - 12h, CST = VN - 13h.
  # e.g. VN Tue 06:00 = Mon 18:00 CDT (summer) / Mon 17:00 CST (winter).
  # To change a slot from a date: give the old series `until`, add a new id with
  # `starts_on` (keeps past classes in history). Ended series can stay listed.
  - id: elliott-piano
    person: huy
    summary: Huy Piano
    timezone: Asia/Ho_Chi_Minh
    days: [TU, SU] # = Chicago Mon, Sat evening
    start: "06:00" # 6:00 PM CDT / 5:00 PM CST
    end: "07:00"
    until: "2026-11-05" # last class VN Tue 11/3 (= Chicago Mon 11/2 5 PM CST)

  - id: huy-piano-monday-vn
    person: huy
    summary: Huy Piano
    timezone: Asia/Ho_Chi_Minh
    days: [MO] # = Chicago Sun evening
    start: "06:00" # 5:00 PM CST / 6:00 PM CDT
    end: "07:00"
    starts_on: "2026-11-06" # first: VN Mon 11/9 (= Chicago Sun 11/8)

  - id: huy-piano-friday-vn
    person: huy
    summary: Huy Piano
    timezone: Asia/Ho_Chi_Minh
    days: [FR] # = Chicago Thu evening
    start: "07:00" # 6:00 PM CST / 7:00 PM CDT
    end: "08:00"
    starts_on: "2026-11-06" # first: VN Fri 11/6 (= Chicago Thu 11/5)

  # Tutors: Chicago Fri 8 PM / Sat 10 AM both this week (CDT) and all winter
  # (CST), so the VN time changes once after this week; from then on they are
  # Vietnam-anchored and move to 9 PM / 11 AM CDT in March.
  - id: huy-ela-tutor
    person: huy
    summary: Huy ELA Tutor
    timezone: Asia/Ho_Chi_Minh # Zoom, Vietnam teacher
    days: [SA] # = Chicago Fri evening
    start: "08:00" # Fri 10/30 8:00 PM CDT (this week only)
    end: "09:00"
    until: "2026-10-31"

  - id: huy-ela-tutor-vn
    person: huy
    summary: Huy ELA Tutor
    timezone: Asia/Ho_Chi_Minh # Zoom, Vietnam teacher
    days: [SA] # = Chicago Fri evening
    start: "09:00" # 8:00 PM CST / 9:00 PM CDT
    end: "10:00"
    starts_on: "2026-11-01" # first: VN Sat 11/7 (= Chicago Fri 11/6)

  - id: huy-math-tutor
    person: huy
    summary: Huy Math Tutor
    timezone: Asia/Ho_Chi_Minh # Zoom, Vietnam teacher
    days: [SA] # = Chicago Sat morning (same day, VN evening)
    start: "22:00" # Sat 10/31 10:00 AM CDT (this week only)
    end: "23:00"
    until: "2026-10-31"

  - id: huy-math-tutor-vn
    person: huy
    summary: Huy Math Tutor
    timezone: Asia/Ho_Chi_Minh # Zoom, Vietnam teacher
    days: [SA] # = Chicago Sat morning (same day, VN evening)
    start: "23:00" # 10:00 AM CST / 11:00 AM CDT
    end: "00:00" # VN midnight (next day)
    starts_on: "2026-11-01" # first: VN Sat 11/7 (= Chicago Sat 11/7)

  - id: elliana-piano
    person: vy
    summary: Vy Piano
    timezone: Asia/Ho_Chi_Minh
    days: [TH] # = Chicago Wed evening
    start: "06:00" # 6:00 PM CDT / 5:00 PM CST
    end: "07:00"

  # Local (not Zoom). Wednesday slot moved to Saturday; old series kept so
  # past Wednesdays stay in history.
  - id: vy-piano-wednesday
    person: vy
    summary: Vy Piano
    days: [WE]
    start: "16:00"
    end: "16:30"
    until: "2026-10-28" # last Wednesday class

  - id: vy-piano-saturday
    person: vy
    summary: Vy Piano
    days: [SA]
    start: "14:00"
    end: "14:30"

  - id: vy-kumon
    person: vy
    summary: Vy Kumon
    days: [MO, TH]
    start: "16:00"
    end: "16:30"

  - id: elliana-badminton
    person: vy
    summary: Vy Badminton
    days: [TU]
    start: "17:30"
    end: "19:00"

  - id: vy-badminton-friday
    person: vy
    summary: Vy Badminton
    days: [FR]
    start: "17:00"
    end: "18:30"

  - id: vy-vietnamese
    person: vy
    summary: Vy Vietnamese
    timezone: Asia/Ho_Chi_Minh # Zoom, Vietnam teacher
    days: [TU, FR] # = Chicago Mon, Thu evening
    start: "06:00" # 6:00 PM CDT / 5:00 PM CST
    end: "07:00"

  - id: moses-badminton-weekday
    person: hoa
    summary: Hoa Badminton
    days: [TU, TH]
    start: "16:00"
    end: "17:00"

  - id: hoa-piano
    person: hoa
    summary: Hoa Piano
    days: [TU] # Chicago local (not Vietnam-anchored), stays 9 PM across DST
    start: "21:00"
    end: "22:00"
